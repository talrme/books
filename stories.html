<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story Review · Miri’s Little World</title><link rel="icon" href="shared/favicon.svg?v=stack1"><link rel="stylesheet" href="shared/review.css"><link rel="apple-touch-icon" href="shared/apple-touch-icon.png?v=stack1"><link rel="icon" type="image/png" sizes="192x192" href="shared/icon-192.png?v=stack1"></head><body><header class="gallery-header"><a href="./" class="wordmark"><img src="shared/favicon.svg" alt="">Miri’s Little World</a><a href="./">Bookshelf <span>↗</span></a></header><main><section class="drafts-intro"><p class="kicker">STORIES FOR MIRI & AVI</p><h1>Little moments.<br>Stories to keep.</h1><p>Illustrated stories for reading together, around age four. Review each book’s numbered words and pictures here.</p><nav class="draft-navigation" aria-label="Story drafts"></nav></section><div id="drafts"></div><a href="./" class="back-gallery">← Back to the bookshelf</a></main><footer class="gallery-footer"><span>Made with love, for Miri & her people.</span><span>Every day is a story.</span></footer><script src="shared/books.js?v=ordered2"></script><script>document.querySelector('.draft-navigation').innerHTML=window.BOOKS.map(b=>`<a href="#${b.id}">${b.title}</a>`).join('');document.querySelector('#drafts').innerHTML=window.BOOKS.map(b=>`<section class="draft-book" id="${b.id}"><p class="kicker">${b.category.toUpperCase()}</p><h2>${b.title}</h2><p>${b.style} illustrations · ${b.motion==='ripple'?'A watery ripple':b.motion==='flutter'?'A paper flutter':'A classic page turn'} between pages</p><div class="draft-actions"><a href="./#book=${b.id}&page=-1">Open the book ↗</a></div><div class="draft-pages">${b.pages.map((p,i)=>`<article class="draft-page"><img src="shared/assets/${b.id}-${i+1}.webp?v=family2" alt="${p.alt.replace(/"/g,'&quot;')}" loading="lazy"><div><span>PAGE ${i+1}</span><p>${p.text}</p></div></article>`).join('')}</div></section>`).join('');</script></body></html>
